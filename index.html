
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sidebar Practice</title>

<style>

body{
    margin: 0;
    font-family: Arial, sans-serif;
    height: 2000px;
}

/* HEADER */
.header{
    display: flex;
    align-items: center;

    background: aqua;
    padding: 15px;

}

/* BUTTON */
.btn{
    margin-left: auto;

    width: 60px;
    height: 35px;

    border: none;
    border-radius: 12px;

    background: white;
    cursor: pointer;
}

/* SIDEBAR */
.sidebar{
    position: fixed;
    top: 0;
    right: 0;

    width: 200px;
    height: 100%;

    background: aqua;

    transform: translateX(100%);
    transition: transform 0.3s ease;
}

/* ACTIVE STATE */
.sidebar.active{
    transform: translateX(0%);
}

/* LINKS */
.sidebar ul{
    list-style: none;
    padding: 0;
    margin: 0;
}

.sidebar a{
    display: block;

    text-decoration: none;
    color: black;

    padding: 20px;
    font-size: 20px;

}
.navbar{
    background-color: black;
    height: 60px;

    align-items: center;
    display: flex;

    position: sticky;
    top: 0;

}
.navbar a{
    margin: 10px;
    color: aliceblue;
    text-decoration: none;
}


</style>
</head>

<body>

<!-- HEADER -->
<div class="header">

    <h1>Hello World</h1>

    <button class="btn" id="btn">
        ☰
    </button>

 
</div>


        <nav class="navbar">
                <a href="#">Home</a>
                <a href="#">About</a>
                <a href="#">Contact</a>
        </nav>


<!-- SIDEBAR -->
<div class="sidebar" id="sidebar">

    <ul>
        <li><a href="#">Home</a></li>
        <li><a href="#">Log In</a></li>
        <li><a href="#">About Us</a></li>
    </ul>

</div>


<script>

const btn = document.getElementById("btn");
const sidebar = document.getElementById("sidebar");

btn.onclick = () => {
    sidebar.classList.toggle("active");
};

</script>

</body>
</html>
