<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body{
            height: 2000px;
            margin: 0;
            font-family: Arial, sans-serif;

        }
        .divclass{
            display: flex;
            background-color: aqua;
            position: sticky;
            top: 0;
            align-items: center;

        }
        .btnclass{
            height: 20px;  
            width: 70px;
            border-radius: 16px;
            background: none;
            margin-left: auto ;

        }
        .active{
            transform: translateX(0%);

        }
        .sidebar-desing{
            background-color: aqua;
            height: 200px;
            width: 100px;
    
            position: fixed;
            left: 0;

            transform: translateX(-100%);
            transition: 0.3s;
        }
        .linka{
        text-decoration: none;
        font-size: 20px;
        margin: 50px 0;
        display: block;
        color: black;

        }
        ul {
        margin: 0;
        padding: 0;
        list-style: none;
}
     
     
    </style>

</head>
<body>
    <div class="divclass">
        <h1>hello word</h1>
        <img src="" alt="">
        <button class="btnclass" id="btn"></button>    
    </div>
            <div id="sidebar" class="sidebar-desing">
                <ul>
                    <li><a href="#"class="linka">home</a></li>
                    <li><a href="#"class="linka">log in</a></li>
                    <li><a href="#"class="linka">about us</a></li>
                </ul>
            </div>
</body>
 <script>                                           /*i dont understand single thing abuts this script*/
    const btn = document.getElementById("btn");
    const sidebar = document.getElementById("sidebar");
    
    btn.onclick = () => {
      sidebar.classList.toggle("active");
    };
    </script>
</html>
